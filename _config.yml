title: "Lê Tuân"
author: "Lê Tuân"
description: "Tuan Le (Lê Tuân), AI/ML engineer in computer vision: LiDAR–camera 3D detection, anomaly detection, predictive maintenance. Postdoc at Heudiasyc, UTC."
url: "https://nautel.github.io"
baseurl: ""

future: true   # build posts dated today even if the clock/timezone says "future"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null   # leave $...$ / $$...$$ untouched; MathJax renders them client-side

plugins:
  - jekyll-sitemap

# Build settings
exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - backup.html
  - README.md
  - vendor
