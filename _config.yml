title: "Lê Tuân"
author: "Lê Tuân"
description: "Lê Tuân (Tuan Le), postdoctoral researcher at Heudiasyc, UTC, working on 3D perception for autonomous driving and robotics: LiDAR and camera 3D object detection, event-based vision."
url: "https://nautel.github.io"
baseurl: ""

future: true   # build posts dated today even if the clock/timezone says "future"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null   # leave $...$ / $$...$$ untouched; MathJax renders them client-side

plugins:
  - jekyll-sitemap

# Build settings
exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - backup.html
  - README.md
  - vendor
